<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>健康行動管理ダッシュボード</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json">

  <!-- Theme & Mobile Capable -->
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="健康管理">

  <!-- Favicon / Touch Icon (PNG) -->
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
    }
    .iframe-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: #0f172a;
    }
    #loadingOverlay {
      position: fixed;
      inset: 0;
      background-color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: opacity 0.3s ease;
      padding: 24px;
      text-align: center;
    }
    #loadingOverlay.is-hidden {
      opacity: 0;
      pointer-events: none;
    }
    .app-logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      margin-bottom: 16px;
      box-shadow: 0 10px 25px rgba(14, 165, 233, 0.25);
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 3.5px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-title {
      font-size: 16px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 6px;
    }
    .loading-sub {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 18px;
    }
    .btn-reload {
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      background-color: #0d9488;
      color: #ffffff;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- ローディング＆再試行画面（読み込み完了で自動的に消えます） -->
  <div id="loadingOverlay">
    <img src="./icon-192.png" alt="App Icon" class="app-logo" onerror="this.style.display='none'">
    <div class="spinner"></div>
    <div class="loading-title">健康行動管理ダッシュボード</div>
    <div class="loading-sub" id="loadingSub">データを読み込んでいます...</div>
    <button type="button" class="btn-reload" onclick="reloadGasFrame()">🔄 再読み込み</button>
  </div>

  <div class="iframe-container">
    <iframe
      id="gasFrame"
      allow="camera; microphone; geolocation; clipboard-read; clipboard-write">
    </iframe>
  </div>

  <script>
    // URL文字列を分割結合してクローラーの単純抽出を回避しつつ、手入力不要で自動起動
    const DEPLOY_PARTS = [
      'https://script.google.com/macros/s/',
      'AKfycbwMvlVflp5Qunq2zELbHn_Vl8jqFLOxuabW2YOrUP0MoliZfqQDfs5uOE1NgVRmipGW',
      '/exec'
    ];

    function getTargetGasUrl() {
      const base = DEPLOY_PARTS.join('');
      const params = new URLSearchParams(window.location.search);
      const action = params.get('action') || '';
      const tab = params.get('tab') || '';
      const q = [];
      if (action.length > 0) q.push('action=' + encodeURIComponent(action));
      if (tab.length > 0) q.push('tab=' + encodeURIComponent(tab));
      return q.length > 0 ? (base + '?' + q.join('&')) : base;
    }

    function hideOverlay() {
      const overlay = document.getElementById('loadingOverlay');
      if (overlay) overlay.classList.add('is-hidden');
    }

    function reloadGasFrame() {
      const frame = document.getElementById('gasFrame');
      const overlay = document.getElementById('loadingOverlay');
      if (overlay) overlay.classList.remove('is-hidden');
      frame.onload = hideOverlay;
      frame.src = getTargetGasUrl();
      // 万が一 onload イベントが発火しにくい環境でも2.5秒後に自動でオーバーレイを解除
      setTimeout(hideOverlay, 2500);
    }

    window.addEventListener('DOMContentLoaded', reloadGasFrame);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('ServiceWorker registered:', reg.scope))
          .catch(err => console.error('ServiceWorker registration failed:', err));
      });
    }
  </script>
</body>
</html>
