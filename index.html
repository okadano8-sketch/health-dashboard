<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>健康行動管理ダッシュボード</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json">

  <!-- Theme & Mobile Capable -->
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="健康管理">

  <!-- Favicon / Touch Icon (PNG) -->
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
    }
    .iframe-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: #0f172a;
    }
    /* ローディング・スプラッシュオーバーレイ */
    #loadingOverlay {
      position: fixed;
      inset: 0;
      background-color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: opacity 0.35s ease, visibility 0.35s ease;
      padding: 24px;
      text-align: center;
    }
    #loadingOverlay.hidden {
      opacity: 0;
      visibility: none;
      pointer-events: none;
    }
    .app-logo {
      width: 76px;
      height: 76px;
      border-radius: 20px;
      margin-bottom: 16px;
      box-shadow: 0 10px 25px rgba(14, 165, 233, 0.25);
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-title {
      font-size: 16px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 6px;
    }
    .loading-sub {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    .retry-actions {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    .btn {
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-primary {
      background-color: #0d9488;
      color: #ffffff;
    }
    .btn-secondary {
      background-color: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    /* 初回URLセットアップモーダル（GitHub上のソースからGAS URLを完全隠蔽） */
    #setupModal {
      position: fixed;
      inset: 0;
      background-color: rgba(15, 23, 42, 0.96);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 30;
      padding: 20px;
    }
    #setupModal.active {
      display: flex;
    }
    .setup-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .setup-card h2 {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #f8fafc;
    }
    .setup-card p {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .setup-input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: #f8fafc;
      font-size: 13px;
      margin-bottom: 14px;
      outline: none;
    }
    .setup-input:focus {
      border-color: #14b8a6;
    }
    /* 右上の極小フローティング復旧ボタン（長押しまたはタップで再読込/URL設定） */
    #floatingHelper {
      position: fixed;
      top: env(safe-area-inset-top, 8px);
      right: 8px;
      z-index: 10;
      display: flex;
      gap: 4px;
      opacity: 0.25;
      transition: opacity 0.2s;
    }
    #floatingHelper:hover, #floatingHelper:active {
      opacity: 1;
    }
    .mini-ctrl-btn {
      background: rgba(15, 23, 42, 0.75);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 8px;
      padding: 4px 7px;
      font-size: 11px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 右上の控えめな再読込＆URL変更ボタン -->
  <div id="floatingHelper">
    <button type="button" class="mini-ctrl-btn" onclick="reloadGasFrame()" title="画面を再読み込み">🔄</button>
    <button type="button" class="mini-ctrl-btn" onclick="openUrlSetup()" title="接続先GAS URLを変更">🔗</button>
  </div>

  <!-- ローディング＆再試行画面 -->
  <div id="loadingOverlay">
    <img src="./icon-192.png" alt="App Icon" class="app-logo" onerror="this.style.display='none'">
    <div class="spinner" id="loadingSpinner"></div>
    <div class="loading-title" id="loadingTitle">健康行動管理ダッシュボード</div>
    <div class="loading-sub" id="loadingSub">安全に接続しています...</div>
    <div class="retry-actions">
      <button type="button" class="btn btn-primary" onclick="reloadGasFrame()">🔄 再読み込み</button>
      <button type="button" class="btn btn-secondary" onclick="openUrlSetup()">🔗 URL設定</button>
    </div>
  </div>

  <!-- 初回・変更用 GAS URL 設定モーダル（公開リポジトリからURLを秘匿） -->
  <div id="setupModal">
    <div class="setup-card">
      <h2>🔗 GAS アプリ接続設定</h2>
      <p>
        セキュリティ保護のため、公開コード内には接続先URLを含めていません。<br>
        ご自身のGoogle Apps ScriptのWebアプリURL（<code>https://script.google.com/macros/s/.../exec</code>）を貼り付けて保存してください（端末内にのみ保存されます）。
      </p>
      <input type="url" id="gasUrlInput" class="setup-input" placeholder="https://script.google.com/macros/s/.../exec">
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button type="button" class="btn btn-secondary" onclick="closeUrlSetup()">キャンセル</button>
        <button type="button" class="btn btn-primary" onclick="saveGasUrlAndLaunch()">保存して起動</button>
      </div>
    </div>
  </div>

  <div class="iframe-container">
    <iframe
      id="gasFrame"
      src="about:blank"
      allow="camera; microphone; geolocation; clipboard-read; clipboard-write">
    </iframe>
  </div>

  <script>
    const STORAGE_KEY_GAS_URL = 'HEALTH_DASHBOARD_GAS_EXEC_URL_V2';
    let loadWatchdogTimer = null;

    function normalizeGasUrl(raw) {

      const trimmed = String(raw || '').trim();
|---|return '';
      // デプロイIDのみが入力された場合も自動で完全URLへ補完
      if (/^AKfyc[\w-]+$/.test(trimmed)) {
        return 'https://script.google.com/macros/s/' + trimmed + '/exec';
      }
      if (trimmed.indexOf('https://script.google.com/') === 0) {
        return trimmed;
      }
      return '';
    }

    function buildTargetUrlWithParams(baseUrl) {
      const params = new URLSearchParams(window.location.search);
      const action = params.get('action') || '';
      const tab = params.get('tab') || '';
      if (!action && !tab) return baseUrl;
      const sep = baseUrl.indexOf('?') === -1 ? '?' : '&';
      const q = [];
      if (action) q.push('action=' + encodeURIComponent(action));
      if (tab) q.push('tab=' + encodeURIComponent(tab));
      return baseUrl + sep + q.join('&');
    }

    function launchGasFrame() {
      const savedUrl = normalizeGasUrl(localStorage.getItem(STORAGE_KEY_GAS_URL));
      if (!savedUrl) {
        document.getElementById('loadingOverlay').classList.add('hidden');
        openUrlSetup();
        return;
      }

      const frame = document.getElementById('gasFrame');
      const overlay = document.getElementById('loadingOverlay');
      document.getElementById('loadingTitle').textContent = '健康行動管理ダッシュボード';
      document.getElementById('loadingSub').textContent = 'データを読み込んでいます...';
      overlay.classList.remove('hidden');

      clearTimeout(loadWatchdogTimer);
      loadWatchdogTimer = setTimeout(() => {
        document.getElementById('loadingSub').textContent = '通信に時間がかかっています。「🔄 再読み込み」をお試しください。';
      }, 9000);

      frame.onload = () => {
        if (frame.src === 'about:blank') return;
        clearTimeout(loadWatchdogTimer);
        overlay.classList.add('hidden');
      };

      frame.src = buildTargetUrlWithParams(savedUrl);
    }

    function reloadGasFrame() {
      launchGasFrame();
    }

    function openUrlSetup() {
      const current = localStorage.getItem(STORAGE_KEY_GAS_URL) || '';
      document.getElementById('gasUrlInput').value = current;
      document.getElementById('setupModal').classList.add('active');
    }

    function closeUrlSetup() {
      document.getElementById('setupModal').classList.remove('active');
    }

    function saveGasUrlAndLaunch() {
      const inputVal = document.getElementById('gasUrlInput').value;
      const validUrl = normalizeGasUrl(inputVal);
      if (!validUrl) {
        alert('有効なGASのWebアプリURL（https://script.google.com/.../exec）またはデプロイIDを入力してください。');
        return;
      }
      localStorage.setItem(STORAGE_KEY_GAS_URL, validUrl);
      closeUrlSetup();
      launchGasFrame();
    }

    window.addEventListener('DOMContentLoaded', () => {
      launchGasFrame();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('ServiceWorker registered:', reg.scope))
          .catch(err => console.error('ServiceWorker registration failed:', err));
      });
    }
  </script>
</body>
</html>
